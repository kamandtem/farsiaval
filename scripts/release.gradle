/*
 * Release-only Gradle init script.
 *
 * The Android project is generated by Capacitor in CI, so signing is injected
 * here instead of committing the generated android/ directory or any secret.
 */
gradle.beforeProject { project ->
    project.pluginManager.withPlugin("com.android.application") {
        def required = [
            "RELEASE_STORE_FILE",
            "RELEASE_STORE_PASSWORD",
            "RELEASE_KEY_ALIAS",
            "RELEASE_KEY_PASSWORD"
        ]
        def missing = required.findAll { System.getenv(it) == null || System.getenv(it).trim().isEmpty() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing Android signing environment variables: ${missing.join(', ')}")
        }

        // Configure as soon as the Android application plugin is applied.
        // Waiting for projectsEvaluated is too late for AGP 8.x to create a
        // new signing config.
        def android = project.extensions.getByName("android")
        def releaseSigning = android.signingConfigs.findByName("release")
        if (releaseSigning == null) {
            releaseSigning = android.signingConfigs.create("release")
        }
        releaseSigning.storeFile = project.rootProject.file(System.getenv("RELEASE_STORE_FILE"))
        releaseSigning.storePassword = System.getenv("RELEASE_STORE_PASSWORD")
        releaseSigning.keyAlias = System.getenv("RELEASE_KEY_ALIAS")
        releaseSigning.keyPassword = System.getenv("RELEASE_KEY_PASSWORD")

        android.buildTypes.getByName("release").signingConfig = releaseSigning
        android.buildTypes.getByName("release").minifyEnabled = false

        def versionName = System.getenv("RELEASE_VERSION_NAME")
        def versionCode = System.getenv("RELEASE_VERSION_CODE")
        if (versionName != null && !versionName.trim().isEmpty()) {
            android.defaultConfig.versionName = versionName
        }
        if (versionCode != null && versionCode.isInteger()) {
            android.defaultConfig.versionCode = versionCode.toInteger()
        }
    }
}
