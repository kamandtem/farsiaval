name: Build Android Release APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run lint
      - name: Build web app
        run: npm run build
      - name: Create Android project, icon and splash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npm run assets:generate
          npx cap sync android
      - name: Load release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/alfba-release.jks
          test -s android/alfba-release.jks
      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: alfba-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export RELEASE_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export RELEASE_VERSION_NAME="1.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          ./gradlew -I ../scripts/release.gradle assembleRelease
      - name: Rename APK and create checksum
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="1.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/alfba-island-${version}.apk"
          sha256sum "release/alfba-island-${version}.apk" > "release/alfba-island-${version}.sha256"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alfba-island-release
          path: release/*
